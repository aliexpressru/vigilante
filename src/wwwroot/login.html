<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilante — Sign in</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            width: 100%;
            max-width: 400px;
            margin: 1rem;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a1a2e; }
        .subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 0.35rem; }
        input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25); }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { color: #c62828; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.25rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vigilante</h1>
        <p class="subtitle">Qdrant Cluster Guardian</p>
        <form id="loginForm">
            <label for="password">Dashboard password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit" id="submitBtn">Sign in</button>
            <p class="error" id="error" role="alert"></p>
        </form>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const returnUrl = new URLSearchParams(window.location.search).get('returnUrl') || '/';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password: passwordInput.value })
                });

                if (response.ok) {
                    window.location.href = returnUrl.startsWith('/') ? returnUrl : '/';
                    return;
                }

                errorEl.textContent = response.status === 401
                    ? 'Invalid password'
                    : 'Sign in failed. Please try again.';
            } catch {
                errorEl.textContent = 'Network error. Is Vigilante running?';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
